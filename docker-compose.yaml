services:
  catalogue:
    build:
      dockerfile: catalogue.Dockerfile
    image: pavankumarsri/catalogue:1.0.0
    container_name: catalogue
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017/catalogue

  user:
    build:
      dockerfile: user.Dockerfile
    image: pavankumarsri/user:1.0.0
    container_name: user
    depends_on:
      - redis

  frontend:
    build:
      dockerfile: frontend.Dockerfile
    image: pavankumarsri/frontend:1.0.0
    container_name: frontend
    depends_on:
      - catalogue
      - user

  mongodb:
    build:
      dockerfile: mongodb.Dockerfile
    image: pavankumarsri/mongodb:1.0.0
    container_name: mongodb

  redis:
    image: redis:7.0
    container_name: redis

networks:
  default:
    driver: bridge
    name: roboshop
    external: false

