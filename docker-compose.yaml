
services:
  catalogue:
    build:
      dockerfile: catalogue.Dockerfile
    image: pavankumarsri/catalogue:1.0.0
    container_name: catalogue
    depends_on:
      - mongodb
    environment:
      MONGO_URL: mongodb://mongodb:27017/catalogue

  mongodb:
    build:
      dockerfile: mongodb.Dockerfile
    image: pavankumarsri/mongodb:1.0.0
    container_name: mongodb

networks:
  default:
    driver: bridge
    name: roboshop
    external: false

